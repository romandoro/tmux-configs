# =============================================================================
# ~/.tmux.conf — Optimized Tmux Configuration for Penetration Testing
# =============================================================================
# Prefix: Ctrl+Q
# =============================================================================

# ---------------------------------------------------------------------------
# 1. BASIC SETTINGS
# ---------------------------------------------------------------------------

unbind C-b
set -g prefix C-q
bind C-q send-prefix

set -sg escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g allow-rename off
setw -g automatic-rename off

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Focus events — editors (vim/nvim) inside tmux handle focus correctly
set -g focus-events on

# Aggressive resize — window adapts to the smallest connected client
# Useful when connected from both laptop and phone simultaneously
setw -g aggressive-resize on

# Activity monitoring — highlight windows where something happened
# Useful for long-running scans in background windows
setw -g monitor-activity on
set -g visual-activity off

# Show pane numbers longer when switching
set -g display-panes-time 2000

# ---------------------------------------------------------------------------
# 2. MOUSE SUPPORT
# ---------------------------------------------------------------------------

set -g mouse on
setw -g mode-keys vi

# Disable right-click interception — terminal handles paste natively
# Critical: without these lines Ctrl+Shift+V / right-click won't work
unbind -T copy-mode MouseDown3Pane
unbind -T root MouseDown3Pane

# NOTE: Removed legacy WheelUpPane/WheelDownPane hacks.
# In tmux 3.x with "mouse on" they are unnecessary and break
# native terminal paste integration in some terminals.

# ---------------------------------------------------------------------------
# 3. COPY-MODE (Vi-style)
# ---------------------------------------------------------------------------

bind Enter copy-mode
bind -n M-Enter copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ---------------------------------------------------------------------------
# 4. CLIPBOARD INTEGRATION
# ---------------------------------------------------------------------------
# tmux-yank plugin handles clipboard detection automatically:
# xclip, xsel, wl-copy, reattach-to-user-namespace (macOS).
# Do NOT add manual if-shell bindings here — they conflict with the plugin.
#
# Plugin binds:
#   y           — copy selection to system clipboard
#   prefix + y  — copy current line to system clipboard
#   prefix + Y  — copy current pane path to system clipboard
#
# Standard tmux paste-buffer (from tmux internal buffer):
#   prefix + ]  — paste
#
# System clipboard paste (bypass tmux buffer):
#   prefix + Ctrl+V  — paste from system clipboard
# ---------------------------------------------------------------------------

bind C-v run-shell "tmux set-buffer \"$(xclip -o -selection clipboard 2>/dev/null || wl-paste 2>/dev/null)\"; tmux paste-buffer"

# ---------------------------------------------------------------------------
# 5. KEY BINDINGS
# ---------------------------------------------------------------------------

bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-n next-window
bind -n M-p previous-window
bind -n M-c new-window -c "#{pane_current_path}"

# Safe close — accidental x/X on production / during pentest is painful
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# Kill entire server with confirmation (clears all sessions — useful for OPSEC)
bind Q confirm-before -p "kill-server? (y/n)" kill-server

bind z resize-pane -Z

# Swap panes — convenient for rearranging
bind > swap-pane -D
bind < swap-pane -U

# Break pane to window / join pane from window
bind b break-pane
bind B command-prompt -p "join pane from:"  "join-pane -s '%%'"

# Synchronize input across all panes (multi-host)
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# ---------------------------------------------------------------------------
# 6. STATUS BAR
# ---------------------------------------------------------------------------

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 120

set -g status-style bg=colour235,fg=colour250

# Left: session name + hostname
set -g status-left "#[bg=colour234,fg=colour82,bold] #S #[bg=colour235,fg=colour250] #H "

# Right: IP + load average + time + date
# IP: uses hostname -I (more portable than grep -oP)
set -g status-right "#[fg=colour250] IP:#(hostname -I | awk '{print $1}') #[fg=colour245] | LOAD:#(cut -d' ' -f1 /proc/loadavg) #[fg=colour82,bold]%H:%M #[fg=colour250]%d.%m.%Y"

setw -g window-status-format "#[fg=colour245] #I:#W "
setw -g window-status-current-format "#[bg=colour82,fg=colour235,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour82,bold
set -g message-style bg=colour82,fg=colour235,bold
set -g display-time 3000

# ---------------------------------------------------------------------------
# 7. PLUGINS (TPM)
# ---------------------------------------------------------------------------
# Install TPM if missing:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Inside tmux: Ctrl+Q I — install plugins
# ---------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
# tmux-sensible intentionally omitted — it overwrites prefix to Ctrl+A

# Clipboard (auto-detects xclip/xsel/wl-copy/reattach-to-user-namespace)
set -g @plugin 'tmux-plugins/tmux-yank'

# Logging (critical for pentest)
#   Ctrl+Q Shift+P — start/stop log
#   Ctrl+Q Alt+P   — save visible area
#   Ctrl+Q Alt+C   — save entire history buffer
set -g @plugin 'tmux-plugins/tmux-logging'

# Save / restore sessions
#   Ctrl+Q Ctrl+S — save
#   Ctrl+Q Ctrl+R — restore
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Auto-save every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ---------------------------------------------------------------------------
# Re-declare prefix AFTER plugins — protection against overwrite
# ---------------------------------------------------------------------------
set -g prefix C-q
unbind C-a
bind C-q send-prefix

# MUST be the last line!
run '~/.tmux/plugins/tpm/tpm'
